services:
  - type: web
    name: solarpulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/dashboard/overview
    envVars:
      - key: SHOWCASE_DATA
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://frontend-mu-opal-90.vercel.app"
      - key: DATABASE_URL
        sync: false